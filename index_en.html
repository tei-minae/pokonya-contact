<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry - pokonya Raccoon Shop</title>
    <style>
        :root {
            --primary: #5d4037;
            --bg: #f5f5f5;
            --card: #fff;
            --border: #ddd;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
            max-width: 600px;
            width: 100%;
        }

        .lang {
            text-align: right;
            margin-bottom: 16px;
            font-size: .8rem;
        }

        .lang a {
            margin-left: 8px;
            text-decoration: none;
            color: var(--primary);
            padding: 2px 6px;
            border: 1px solid var(--primary);
            border-radius: 4px;
        }

        .lang a:hover,
        .lang strong {
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        p {
            font-size: .9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity .3s;
        }

        .submit-btn:hover {
            opacity: .85;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .terms-btn {
            display: inline-block;
            padding: 10px 24px;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: all .3s;
            margin: 8px;
        }

        .terms-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="lang">
            <a href="index.html">JP</a>
            <strong>EN</strong>
            <a href="index_ko.html">KO</a>
            <a href="index_zh.html">ZH</a>
        </div>
        <h1>Inquiry - pokonya Raccoon Shop</h1>
        <p>For questions, bug reports, or feature requests regarding our products, please use the form below.</p>
        <form action="https://ssgform.com/s/n2W0qraNSNzv" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="Question (EN)">Question about a product</option>
                    <option value="Bug (EN)">Bug Report</option>
                    <option value="Request (EN)">Feature Request</option>
                    <option value="Legal (EN)">Legal Inquiry</option>
                    <option value="Other (EN)">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="order_id">Order ID (if purchased)</label>
                <input type="text" id="order_id" name="order_id" placeholder="e.g. 12345678">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Please describe your inquiry"></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
        <footer>
            <p style="font-weight:bold;color:var(--primary);margin-bottom:12px;">Please read before use</p>
            <a href="usage_en.html" class="terms-btn">📖 Instruction Manual</a>
            <a href="terms_en.html" class="terms-btn">📖 Terms of Use</a>
            <p style="font-size:.8rem;color:#777;">&copy; 2026 pokonya - Raccoon Shop</p>
        </footer>
    </div>
</body>

</html>
