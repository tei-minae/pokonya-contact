<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - pokonya Raccoon Shop</title>
    <style>
        :root {
            --primary: #5d4037;
            --bg: #f5f5f5;
            --card: #fff;
            --border: #ddd;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
            max-width: 600px;
            width: 100%;
        }

        .lang {
            text-align: right;
            margin-bottom: 16px;
            font-size: .8rem;
        }

        .lang a {
            margin-left: 8px;
            text-decoration: none;
            color: var(--primary);
            padding: 2px 6px;
            border: 1px solid var(--primary);
            border-radius: 4px;
        }

        .lang a:hover,
        .lang strong {
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        p {
            font-size: .9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity .3s;
        }

        .submit-btn:hover {
            opacity: .85;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .terms-btn {
            display: inline-block;
            padding: 10px 24px;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: all .3s;
            margin-bottom: 16px;
        }

        .terms-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="lang">
            <a href="index.html">JP</a>
            <a href="index_en.html">EN</a>
            <strong>KO</strong>
            <a href="index_zh.html">ZH</a>
        </div>
        <h1>문의하기 - pokonya Raccoon Shop</h1>
        <p>상품에 관한 질문, 버グ 리포트 또는 제작 요청은 아래 폼을 이용해 주세요.</p>
        <form action="https://ssgform.com/s/n2W0qraNSNzv" method="POST">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" required placeholder="성함을 입력해 주세요">
            </div>
            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label for="category">문의 항목</label>
                <select id="category" name="category">
                    <option value="Question (KO)">상품 관련 질문</option>
                    <option value="Bug (KO)">버그 리포트</option>
                    <option value="Request (KO)">제작 요청</option>
                    <option value="Legal (KO)">법률 문의</option>
                    <option value="Other (KO)">기타</option>
                </select>
            </div>
            <div class="form-group">
                <label for="order_id">주문 번호 (구매하신 경우)</label>
                <input type="text" id="order_id" name="order_id" placeholder="예: 12345678">
            </div>
            <div class="form-group">
                <label for="message">내용</label>
                <textarea id="message" name="message" required placeholder="문의 내용을 입력해 주세요"></textarea>
            </div>
            <button type="submit" class="submit-btn">전송하기</button>
        </form>
        <footer>
            <p style="font-weight:bold;color:var(--primary);margin-bottom:12px;">이용 전 반드시 확인해 주세요</p>
            <a href="terms_ko.html" class="terms-btn">📖 이용 약관 (Terms of Use)</a>
            <p style="font-size:.8rem;color:#777;">&copy; 2026 pokonya - Raccoon Shop</p>
        </footer>
    </div>
</body>

</html>
