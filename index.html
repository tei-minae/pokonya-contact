<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - ぽこにゃの掘り出し物</title>
    <style>
        :root {
            --primary-color: #5d4037;
            --background-color: #f5f5f5;
            --container-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--container-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>お問い合わせ - ぽこにゃの掘り出し物</h1>
        <p>当ショップの商品に関するご質問、不具合報告、またはリクエスト等、以下のフォームよりお気軽にお問い合わせください。</p>

        <form action="https://ssgform.com/s/n2W0qraNSNzv" method="POST">
            <div class="form-group">
                <label for="name">お名前</label>
                <input type="text" id="name" name="name" required placeholder="例：山田 太郎">
            </div>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label for="category">お問い合わせ項目</label>
                <select id="category" name="category"
                    style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem;">
                    <option value="質問">商品に関するご質問</option>
                    <option value="不具合">不具合報告</option>
                    <option value="リクエスト">制作リクエスト</option>
                    <option value="特定商取引法">特定商取引法に基づく開示請求</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="order_id">注文番号（ご購入済みの場合）</label>
                <input type="text" id="order_id" name="order_id" placeholder="例：12345678">
            </div>
            <div class="form-group">
                <label for="message">内容</label>
                <textarea id="message" name="message" required placeholder="お問い合わせ内容をご記入ください"></textarea>
            </div>
            <button type="submit" class="submit-btn">内容を送信する</button>
        </form>

        <footer>
            <a href="terms.html"
                style="color: var(--primary-color); text-decoration: none; font-weight: bold;">利用規約を確認する</a><br>
            &copy; 2026 pokonya - Raccoon Shop
        </footer>
    </div>
</body>

</html>
